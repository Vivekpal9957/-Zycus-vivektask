<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAM Triage Agent</title>
<style>
:root{--bg:#ffffff;--panel:#ffffff;--panel2:#f6f7f9;--line:#e3e6eb;--tx:#1b2430;--mut:#667085;--acc:#1f4e9c;--acc2:#1f4e9c;--ok:#1a7f4b;--warn:#b25e09;--bad:#c0262d;--r:6px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff}
.logo{width:32px;height:32px;border-radius:6px;background:var(--acc);display:grid;place-items:center;font-weight:800;color:#fff}
h1{font-size:15px;margin:0}h1 small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
.sp{flex:1}.stat{color:var(--mut);font-size:12px;display:flex;gap:14px}.stat b{color:var(--tx)}
select,input,button{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 11px}
button{cursor:pointer}button.pri{background:var(--acc);border:0;color:#fff;font-weight:600;padding:9px 18px}
button:disabled{opacity:.5;cursor:wait}
main{flex:1;display:grid;grid-template-columns:310px minmax(0,1fr) 400px;gap:14px;padding:14px;min-height:0}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto;min-height:0}
.col>h2{position:sticky;top:0;z-index:2;margin:0;padding:12px 16px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;padding:10px 12px}.tabs button{flex:1;padding:6px}.tabs .on{background:var(--acc);color:#fff;border-color:transparent}
.q{padding:0 12px 10px}.q input{width:100%}
.ti{padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;transition:.15s}.ti:hover{background:var(--panel2)}.ti.on{background:var(--panel2);box-shadow:inset 3px 0 var(--acc)}
.ti .id{font-size:11px;color:var(--mut);display:flex;gap:6px;align-items:center}.ti .sj{font-weight:600;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:4px;border:1px solid var(--line);color:var(--mut)}.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.card{margin:14px;padding:16px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.card h3{margin:0 0 6px;font-size:17px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.body{white-space:pre-wrap;color:var(--tx);opacity:.92;margin:10px 0 14px}
.tl{padding:4px 14px 20px;position:relative}.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:10px 0;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}.step .dot{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font-size:16px;background:var(--panel2);border:1px solid var(--line);position:relative}
.step:not(:last-child) .dot:after{content:"";position:absolute;top:36px;left:16px;height:calc(100% + 4px);width:2px;background:var(--line)}
.step .tn{font-weight:700;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--acc)}.step .th{color:var(--mut);font-style:italic;margin:2px 0}
.args{font:11.5px ui-monospace,Menlo,monospace;color:var(--mut);word-break:break-word}.obs{margin-top:6px;padding:8px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px}
.obs.bad{border-color:var(--bad)}.thinking{padding:14px;color:var(--mut)}.thinking i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:4px;animation:p 1s infinite}.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}@keyframes p{50%{opacity:.2;transform:scale(.7)}}
.empty{padding:50px 24px;text-align:center;color:var(--mut)}
.dec{padding:16px}.pr{display:flex;gap:12px;align-items:center}.P{font-size:34px;font-weight:800;width:74px;height:74px;border-radius:8px;display:grid;place-items:center;color:#fff}
.P1{background:#c0262d}.P2{background:#d9822b}.P3{background:#1f4e9c}.P4{background:#667085}
.kv{font-size:12px;color:var(--mut)}.kv b{display:block;color:var(--tx);font-size:15px}
.flags{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.flag{padding:8px 10px;border-radius:6px;border:1px solid var(--line);font-size:12px;color:var(--mut);display:flex;gap:7px;align-items:center}
.flag.on{color:var(--tx);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}.flag .d{width:8px;height:8px;border-radius:50%;background:var(--line)}.flag.on .d{background:var(--warn)}
.sec{margin-top:16px}.sec h4{margin:0 0 6px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
.box{padding:11px 12px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);white-space:pre-wrap;font-size:13px}
.mini{font-size:11px;padding:2px 9px;border-radius:7px}
.kbc{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font:12px ui-monospace,Menlo,monospace;margin:0 6px 6px 0}
.health{display:grid;grid-template-columns:1fr 1fr;gap:10px}.health .kv{padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.neg{color:var(--bad)!important}.pos{color:var(--ok)!important}
@media(max-width:1100px){body{height:auto}main{grid-template-columns:1fr}.col{max-height:none}}
</style></head><body>
<header><div class="logo">T</div><h1>TAM Ticket Triage<small>Support operations</small></h1><div class="sp"></div>
<div class="stat" id="stat"></div>
<select id="prov"><option value="mock">Offline demo policy</option><option value="groq">Groq (real LLM)</option></select></header>
<main>
 <section class="col"><h2>Ticket queue</h2><div class="tabs"><button id="t-review" class="on">Review set</button><button id="t-all">Recent</button></div>
  <div class="q"><input id="q" placeholder="Search tickets…"></div><div id="list"></div></section>
 <section class="col"><h2>Investigation <span class="chip" id="runst"></span></h2><div id="center"><div class="empty">Select a ticket to begin.</div></div></section>
 <section class="col"><h2>Decision</h2><div id="right"><div class="empty">Run the agent to see its decision.</div></div></section>
</main>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICON={resolve_account:"🔎",get_account_context:"📊",search_tickets:"🎫",get_ticket:"📄",search_kb:"📚",get_kb_article:"📖",submit_triage:"✅"};
let set="review",cur=null,es=null;
fetch("/api/meta").then(r=>r.json()).then(m=>{$("#stat").innerHTML=`<span><b>${m.counts.tickets}</b> tickets</span><span><b>${m.counts.accounts}</b> accounts</span><span><b>${m.counts.kb}</b> KB</span>`;
 $("#prov").value=m.default==="groq"?"groq":"mock"});
async function loadList(){const r=await (await fetch(`/api/tickets?set=${set}&q=${encodeURIComponent($("#q").value)}`)).json();
 $("#list").innerHTML=r.map(t=>`<div class="ti ${cur===t.id?"on":""}" data-id="${esc(t.id)}"><div class="id">${esc(t.id)} ${t.account_id?"":'<span class="chip warn">no account</span>'}${t.done?'<span class="chip ok">triaged</span>':""}</div><div class="sj">${esc(t.subject)}</div></div>`).join("")||'<div class="empty">No tickets</div>';
 document.querySelectorAll(".ti").forEach(e=>e.onclick=()=>select(e.dataset.id))}
$("#t-review").onclick=()=>{set="review";tab()};$("#t-all").onclick=()=>{set="all";tab()};
function tab(){$("#t-review").classList.toggle("on",set==="review");$("#t-all").classList.toggle("on",set==="all");loadList()}
$("#q").oninput=loadList;
async function select(id){cur=id;if(es)es.close();loadList();const {ticket:t,saved}=await (await fetch("/api/ticket/"+id)).json();
 $("#runst").textContent="";
 $("#center").innerHTML=`<div class="card"><h3>${esc(t.subject)}</h3><div class="meta"><span class="chip">${esc(t.ticket_id)}</span><span class="chip">${esc(t.channel)}</span><span class="chip">${esc((t.created_at||"").slice(0,10))}</span><span class="chip ${t.account_id?"":"warn"}">${t.account_id?esc(t.account_id):"account_id blank"}</span><span class="chip">${esc(t.product||"")}</span>${t.company?`<span class="chip">${esc(t.company)}</span>`:""}</div>
  <div class="body">${esc(t.body)}</div><button class="pri" id="go">▶ Triage with agent</button></div><div class="tl" id="tl"></div>`;
 $("#go").onclick=run;
 if(saved){renderTrace(saved.reasoning_trace);renderDecision(saved)}else $("#right").innerHTML='<div class="empty">Run the agent to see its decision.</div>'}
function stepHTML(s){return `<div class="step"><div class="dot">${ICON[s.tool]||"•"}</div><div><div class="tn">${esc(s.tool)}</div>${s.thought?`<div class="th">“${esc(s.thought)}”</div>`:""}<div class="args">${esc(JSON.stringify(s.args||{}))}</div><div class="obs ${/error/.test(s.observation)?"bad":""}">${esc(s.observation)}</div></div></div>`}
function renderTrace(tr){$("#tl").innerHTML=tr.map(stepHTML).join("")}
function run(){$("#go").disabled=true;$("#tl").innerHTML='<div class="thinking"><i></i><i></i><i></i> Agent is investigating…</div>';$("#right").innerHTML='<div class="empty">Working…</div>';
 const p=$("#prov").value;es=new EventSource(`/api/run/${cur}?provider=${p}`);let n=0;
 es.onmessage=e=>{const d=JSON.parse(e.data);
  if(d.type==="start")$("#runst").textContent=d.provider+" · "+d.model;
  if(d.type==="step"){if(!n++)$("#tl").innerHTML="";$("#tl").insertAdjacentHTML("beforeend",stepHTML(d));$("#tl").lastElementChild.scrollIntoView({block:"nearest",behavior:"smooth"});
    if(d.tool!=="submit_triage")$("#tl").insertAdjacentHTML("beforeend",'<div class="thinking" id="th"><i></i><i></i><i></i></div>'),0;
    const th=document.querySelectorAll("#th");if(th.length>1)th[0].remove()}
  if(d.type==="done"){es.close();document.querySelectorAll("#th").forEach(x=>x.remove());$("#go").disabled=false;$("#go").textContent="↻ Re-run";renderDecision(d.result);loadList()}
  if(d.type==="error"){es.close();$("#go").disabled=false;$("#tl").innerHTML=`<div class="card"><b class="neg">Error</b><div class="body">${esc(d.message)}</div></div>`;$("#right").innerHTML=""}};
 es.onerror=()=>{es.close();$("#go").disabled=false}}
async function renderDecision(r){const flag=(on,l)=>`<div class="flag ${on?"on":""}"><span class="d"></span>${l}</div>`;
 const copy=(id)=>`<button class="mini" onclick="navigator.clipboard.writeText(document.getElementById('${id}').innerText)">Copy</button>`;
 let acct="";if(r.account_id){const a=await (await fetch("/api/account/"+r.account_id)).json();if(a.account){const A=a.account,bad=["At Risk","Churning"].includes(A.health_status);
  acct=`<div class="sec"><h4>Account health</h4><div class="box"><b>${esc(A.company)}</b> <span class="chip">${esc(A.plan_tier)}</span> <span class="chip">${esc(A.account_id)}</span><div class="health" style="margin-top:10px">
  <div class="kv">Health<b class="${bad?"neg":"pos"}">${esc(A.health_status)}</b></div><div class="kv">Renewal<b class="${a.days_to_renewal<=90?"neg":""}">${a.days_to_renewal} days</b></div>
  <div class="kv">Usage<b>${esc(A.usage_trend)}</b></div><div class="kv">Seats active<b>${a.seats.utilization_pct}%</b></div><div class="kv">TAM<b style="font-size:13px">${esc(A.tam)}</b></div></div>
  <div class="kv" style="margin-top:8px">${a.escalation_notes.map(n=>"• "+esc(n)).join("<br>")}</div></div></div>`}}
 $("#right").innerHTML=`<div class="dec"><div class="pr"><div class="P ${r.priority}">${r.priority}</div><div><div class="kv">Category<b>${esc(r.category.replace("_"," "))}</b></div><div class="kv" style="margin-top:6px">Route to<b>${esc(r.routing.replace("_"," "))}</b></div></div></div>
 <div class="flags">${flag(r.escalate,"Escalate")}${flag(r.notify_tam,"Notify TAM")}${flag(r.is_duplicate,"Duplicate"+(r.duplicate_of?" of "+esc(r.duplicate_of):""))}${flag(r.needs_clarification,"Needs clarification")}</div>
 ${r.escalation_reason?`<div class="box">⚠ ${esc(r.escalation_reason)}</div>`:""}
 ${r.needs_clarification?`<div class="sec"><h4>Questions for customer</h4><div class="box">${r.clarification_questions.map(q=>"• "+esc(q)).join("\n")}</div></div>`:""}
 ${acct}
 <div class="sec"><h4>Account resolution</h4><div class="box">${r.account_id?esc(r.account_id)+" · confidence "+Math.round(r.account_confidence*100)+"%":"Unresolved – not guessed"}</div></div>
 <div class="sec"><h4>KB cited</h4>${r.kb_articles.map(k=>`<span class="kbc">${esc(k)}</span>`).join("")||'<span class="kv">none</span>'}</div>
 <div class="sec"><h4>Customer reply ${copy("cr")}</h4><div class="box" id="cr">${esc(r.customer_reply)}</div></div>
 <div class="sec"><h4>Internal note ${copy("in")}</h4><div class="box" id="in">${esc(r.internal_note)}</div></div></div>`}
loadList().then(()=>select("TCK-9001"));
</script></body></html>
